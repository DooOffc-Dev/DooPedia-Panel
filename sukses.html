<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DooPedia - Server Berhasil</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="rot/logo.png">
    <link rel="apple-touch-icon" href="rot/logo.png">
    
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center gap-3">
                    <img src="rot/logo.png" alt="DooPedia" class="navbar-logo spin-logo">
                    <span class="text-xl font-bold text-white">Doo<span class="gradient-text">Pedia</span></span>
                </a>
                
                <a href="index.html" class="btn-secondary text-sm px-4 py-2">
                    <i class="fas fa-arrow-left"></i>
                    Back
                </a>
            </div>
        </div>
    </nav>
    
    <!-- Content -->
    <div class="min-h-screen flex items-center justify-center px-4 pt-16">
        <div class="max-w-lg w-full">
            <div class="card text-center p-8">
                <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-green-500/20 flex items-center justify-center">
                    <i class="fas fa-check text-green-400 text-4xl"></i>
                </div>
                
                <h1 class="text-3xl font-bold mb-4">Server <span class="gradient-text">Berhasil Dibuat</span>!</h1>
                <p class="text-gray-400 mb-8">
                    Selamat! Panel server kamu sudah aktif.
                </p>
                
                <div class="bg-white/5 rounded-2xl p-6 border border-green-500/30 mb-8">
                    <h3 class="font-bold mb-4">Data Login Panel</h3>
                    <div class="space-y-4 text-left">
                        <div>
                            <p class="text-gray-400 text-sm">Panel URL</p>
                            <p class="font-bold text-green-400" id="panelUrl">-</p>
                        </div>
                        <div>
                            <p class="text-gray-400 text-sm">Server Name</p>
                            <p class="font-bold" id="serverName">-</p>
                        </div>
                        <div>
                            <p class="text-gray-400 text-sm">Username</p>
                            <p class="font-bold font-mono" id="username">-</p>
                        </div>
                        <div>
                            <p class="text-gray-400 text-sm">Password</p>
                            <p class="font-bold font-mono" id="password">-</p>
                        </div>
                    </div>
                </div>
                
                <button onclick="copyCredentials()" class="btn-secondary w-full mb-4">
                    <i class="fas fa-copy"></i>
                    Copy Semua
                </button>
                
                <a href="index.html" class="btn-primary px-6 py-3 inline-flex w-full justify-center">
                    <i class="fas fa-check"></i>
                    Selesai
                </a>
            </div>
        </div>
    </div>
    
    <script>
        // Ambil data server dari localStorage
        const serverData = JSON.parse(localStorage.getItem('doopedia_server_data'));
        
        if (serverData) {
            document.getElementById('panelUrl').textContent = serverData.panelUrl;
            document.getElementById('serverName').textContent = serverData.serverName;
            document.getElementById('username').textContent = serverData.username;
            document.getElementById('password').textContent = serverData.password;
        }
        
        function copyCredentials() {
            const panelUrl = document.getElementById('panelUrl').textContent;
            const serverName = document.getElementById('serverName').textContent;
            const username = document.getElementById('username').textContent;
            const password = document.getElementById('password').textContent;
            
            const text = `Panel URL: ${panelUrl}\nServer: ${serverName}\nUsername: ${username}\nPassword: ${password}`;
            
            navigator.clipboard.writeText(text);
            alert('Data login disalin!');
        }
    </script>
</body>
</html>
